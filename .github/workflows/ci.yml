# Build, typecheck and test on every PR and push to main. The job is named `checks` so it can be the required
# status check, the same name every site repo uses.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # dist/ is committed (sites install from a git tag with no build step), so it must match the source.
      - name: dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "dist/ is stale. Run 'pnpm build' and commit it." >&2
            git status --short -- dist >&2
            exit 1
          fi
      - run: pnpm test
